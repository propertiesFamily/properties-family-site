<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties Family</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#f4efe6;
    color:#2e2e2e;
}

header{
    background:#2f3e2f;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header img{
    height:60px;
}

nav a{
    color:#f4efe6;
    margin-left:25px;
    text-decoration:none;
    font-weight:500;
}

.hero{
    background:url('casa1.jpg') center/cover no-repeat;
    height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background-color:rgba(0,0,0,0.45);
    background-blend-mode:darken;
}

.hero h1{
    font-size:48px;
    margin:0;
}

.hero p{
    font-size:20px;
    margin-top:15px;
}

.section{
    padding:70px 20px;
    text-align:center;
}

.section h2{
    color:#2f3e2f;
    margin-bottom:30px;
}

.experience{
    background:white;
}

.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    max-width:1100px;
    margin:auto;
}

.projects img{
    width:100%;
    border-radius:10px;
}

.services{
    background:#e8e1d6;
}

.reviews{
    background:white;
}

.contact{
    background:#e8e1d6;
}

.contact a{
    text-decoration:none;
    color:#2e2e2e;
}

.contact img{
    width:65px;
}

footer{
    background:#2f3e2f;
    color:white;
    text-align:center;
    padding:20px;
}

/* Botón flotante WhatsApp */
.whatsapp-float{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
